"$schema" = 'https://starship.rs/config-schema.json'

format = """
([🢖 ](red)$status\n)\
${custom.unshare}\
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$git_status\
$git_state\
$cmd_duration\
$python\
$kubernetes\
$line_break\
$sudo\
${custom.kubie}\
$character\
"""

right_format = """

"""


scan_timeout = 10
add_newline = false

#palette = 'catppuccin_mocha'


[username]
disabled = true
show_always = false
style_user = "bold fg:green"
style_root = "bold fg:red"
format = '[$user]($style)'

[hostname]
disabled = false
ssh_only = false
style = "bold fg:green"
#format = '[$ssh_symbol$hostname]($style) '
format = '[${ssh_symbol}kelpie]($style) '
ssh_symbol = "@"

[directory]
style = "bold fg:blue"
#format = "[ $path]($style)"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = true
read_only="🔒︎"

[git_branch]
#symbol = ""
symbol = ""
style = ""
format = '[$symbol](fg:black)$branch'

[git_status]
ahead="[+$count](fg:green)"
behind="[-$count](fg:red)"

staged="[A](fg:green)"
renamed="[R](fg:green)"

modified="[M](fg:red)"
deleted="[D](fg:red)"
untracked="[?](fg:red)"

style = ""
format = '(:$staged$renamed$modified$deleted$untracked)$ahead_behind '


[python]
symbol = ""
style = "bg:white fg:black"
format = '[](white)[$symbol($version)(\($virtualenv\))]($style)[](white) '

[docker_context]
disabled = false
symbol = ""
style = ""
format = '[$symbol($context)]($style)'

[kubernetes]
disabled = false
style = "bg:white fg:black"
symbol = ""
format = '[](white)$symbol[$context(⠶$namespace)]($style)[](white) '
#format = '[$symbol$context]($style)'
#format = '[$symbol$cluster]($style)'

[[kubernetes.contexts]]
context_pattern = "^kind.*"
#context_alias = "kind"

[[kubernetes.contexts]]
context_pattern = "^crc-.*"
#context_alias = "crc"

[line_break]
disabled = false

[character]
disabled = false
#symbol = '[❯](bold fg:green)'
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:green)'

[cmd_duration]
show_milliseconds = false
format = "$duration "
style = "bg:lavender"
disabled = false
show_notifications = false
min_time = 60000

[palettes.zkraus]
green = "#000000"

[battery]
disabled = true
[[battery.display]]
threshold = 101
style = ''

[status]
disabled = false
format = "[$status]($style)"
success_style = "bold green"
pipestatus = true
pipestatus_separator = ","
pipestatus_format = '$pipestatus ' 

[sudo]
disabled = true
format = "[$symbol]($style)"
symbol = "🔓"

[fill]
disabled = false
symbol = "▪"

[custom.unshare]
command = "echo UNSHARE"
when = '[ -n "$_CONTAINERS_USERNS_CONFIGURED" ]'
style = "bg:yellow fg:black"
format = "[ $output ]($style) "

[custom.kubie]
when = '[ -n "$KUBIE_ACTIVE" ]'
symbol = '⎈'
style = "fg:green"
format = "[$symbol]($style)"

